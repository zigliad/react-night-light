		<meta
			property="og:description"
			content="An interactive pull-cord light switch for React with physics-based animations."
		/>
		<meta
			property="og:image"
			content="https://zigliad.github.io/react-night-light/social-preview.png"

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />

			name="twitter:url"
			content="https://zigliad.github.io/react-night-light/"

			name="twitter:description"

		/>

		<!-- Favicon -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

		<style>
			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				width: 100%;
				overflow-x: hidden;

				-webkit-tap-highlight-color: rgba(0, 0, 0, 0);

				position: relative;
			}

			input[type="range"] {

				max-width: 100%;
			}
